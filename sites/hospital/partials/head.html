<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="{{robots}}">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" type="application/json" href="/agent-manifest.json" title="Agent manifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Dialect · {{name}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Dialect: lab results that stay readable and comparable when they travel between hospitals.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{pageTitle}}">
  <meta name="twitter:description" content="{{pageDescription}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Dialect · {{name}}",
    "url": "{{siteUrl}}",
    "description": "{{pageDescription}}",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Any web browser",
    "isAccessibleForFree": true,
    "license": "https://opensource.org/licenses/MIT",
    "disclaimer": "Synthetic demonstration with fictional hospitals and patients. Not for clinical use. Not medical advice."
  }
  </script>
  <script type="module" src="/assets/js/common.js"></script>
